    jwtSecret: ${JWT_SECRET:9a4f2c8d3b7a1e6f4c8b2d0e5a9f3c7b1d4e6a8f2c5d7e9b1a3c5e7f9a2b4c6d}
    jwtExpirationMs: 86400000

  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin}
    email: admin@paycore.com